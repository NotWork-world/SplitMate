apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Shrink and optimise release builds with R8 (and drop unused resources).
 * The mapping file for readable crash traces is packed into the app bundle.
 */
def enableProguardInReleaseBuilds = true

/**
 * Version: mobile/package.json "version" is the single source of truth (Settings shows it).
 * Google Play needs a versionCode that grows with every upload: 1.2.3 -> 10203.
 */
def appVersion = new groovy.json.JsonSlurper().parse(file("../../package.json")).version as String
def versionParts = appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!versionParts.matches()) {
    throw new GradleException("mobile/package.json version must look like 1.2.3, got '${appVersion}'")
}
def (versionMajor, versionMinor, versionPatch) = (1..3).collect { versionParts.group(it) as int }
if (versionMinor > 99 || versionPatch > 99) {
    throw new GradleException("Minor and patch versions must stay below 100 to fit the versionCode scheme, got '${appVersion}'")
}
def appVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch

/**
 * Release signing with your private upload key, from Gradle properties
 * (~/.gradle/gradle.properties) or environment variables (docs/play-store.md).
 * Without it, release APKs use the debug key (fine for testing on a phone,
 * rejected by Google Play) and app bundles refuse to build.
 */
def uploadKeySetting = { String name -> (findProperty(name) ?: System.getenv(name)) as String }
def uploadKey = [
    storeFile    : uploadKeySetting("SPLITMATE_UPLOAD_STORE_FILE"),
    storePassword: uploadKeySetting("SPLITMATE_UPLOAD_STORE_PASSWORD"),
    keyAlias     : uploadKeySetting("SPLITMATE_UPLOAD_KEY_ALIAS"),
    keyPassword  : uploadKeySetting("SPLITMATE_UPLOAD_KEY_PASSWORD"),
]
def hasUploadKey = uploadKey.values().every { it }
if (hasUploadKey && !file(uploadKey.storeFile).isFile()) {
    throw new GradleException("SPLITMATE_UPLOAD_STORE_FILE points to '${uploadKey.storeFile}', which doesn't exist")
}
def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
if (!hasUploadKey && requestedTasks.any { it.contains("bundlerelease") }) {
    throw new GradleException("SplitMate: bundleRelease makes the app bundle for Google Play, which needs your upload key. " +
        "Set SPLITMATE_UPLOAD_STORE_FILE, SPLITMATE_UPLOAD_STORE_PASSWORD, SPLITMATE_UPLOAD_KEY_ALIAS and " +
        "SPLITMATE_UPLOAD_KEY_PASSWORD (docs/play-store.md). For a test APK, use assembleRelease.")
}
if (!hasUploadKey && requestedTasks.any { it.contains("release") }) {
    logger.warn("SplitMate: no upload key configured, so this release build is signed with the debug key. " +
        "It installs on devices but Google Play will reject it.")
}
/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "world.notwork.splitmate"
    defaultConfig {
        applicationId "world.notwork.splitmate"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            upload {
                storeFile file(uploadKey.storeFile)
                storePassword uploadKey.storePassword
                keyAlias uploadKey.keyAlias
                keyPassword uploadKey.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasUploadKey ? signingConfigs.upload : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
