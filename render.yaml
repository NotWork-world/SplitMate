services:
  - type: web
    name: splitmate-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: SPLITMATE_ENV
        value: production
      - key: SPLITMATE_DATABASE_URL
        sync: false # paste the Neon connection string in the dashboard
      - key: SPLITMATE_JWT_SECRET
        generateValue: true
      - key: SPLITMATE_SIGNING_SECRET
        generateValue: true
      - key: SPLITMATE_PUBLIC_BASE_URL
        sync: false # https://<this service>.onrender.com — used in invite links
      - key: SPLITMATE_FIREBASE_CREDENTIALS
        sync: false # Firebase service-account JSON for phone notifications (docs/push-notifications.md)
      - key: SPLITMATE_GOOGLE_CLIENT_IDS
        sync: false # the Web OAuth client ID; leave empty to hide Google sign-in
      # Bill photos are temporary (deleted once the bill is finalised), so the
      # container's own disk is enough. Switch to "s3" + SPLITMATE_S3_* only if
      # you later want to keep photos.
      - key: SPLITMATE_STORAGE_BACKEND
        value: local
      - key: SPLITMATE_STORAGE_DIR
        value: /app/storage
