services:
  - type: web
    name: splitmate-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: SPLITMATE_ENV
        value: production
      - key: SPLITMATE_DATABASE_URL
        sync: false # paste the Neon connection string in the dashboard
      - key: SPLITMATE_JWT_SECRET
        generateValue: true
      - key: SPLITMATE_SIGNING_SECRET
        generateValue: true
      - key: SPLITMATE_GOOGLE_CLIENT_IDS
        sync: false
      - key: SPLITMATE_STORAGE_BACKEND
        value: s3
      - key: SPLITMATE_S3_BUCKET
        sync: false
      - key: SPLITMATE_S3_ENDPOINT_URL
        sync: false
      - key: SPLITMATE_S3_ACCESS_KEY_ID
        sync: false
      - key: SPLITMATE_S3_SECRET_ACCESS_KEY
        sync: false
